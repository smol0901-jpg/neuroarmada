<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Нейроармада - захватывающая match-3 игра с тигрятами">
  <meta name="theme-color" content="#0f0f1a">
  <title>🐯 Нейроармада</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-dark: #0f0f1a; --bg-card: #1a1a2e; --bg-card-light: #252542;
      --accent-orange: #FF8C42; --accent-yellow: #FFD700;
      --accent-cyan: #4ECDC4; --accent-purple: #A78BFA;
      --accent-pink: #FF6B9D; --accent-green: #4ADE80;
      --text-primary: #ffffff; --text-secondary: #a0a0b0;
      --shadow-glow: 0 0 30px rgba(255,140,66,0.3);
      --shadow-card: 0 8px 32px rgba(0,0,0,0.4);
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Nunito', sans-serif;
      background: var(--bg-dark); color: var(--text-primary);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    
    .header {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
      z-index: 100; background: linear-gradient(to bottom, rgba(15,15,26,0.95), transparent);
    }
    .title {
      font-size: 1.6rem; font-weight: 900;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-yellow));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      text-shadow: 0 0 30px rgba(255,140,66,0.5);
      letter-spacing: 1px;
    }
    .header-controls { display: flex; gap: 10px; }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 14px; border: none;
      background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);
      color: var(--text-primary); font-size: 1.3rem;
      cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .icon-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
    .icon-btn:active { transform: scale(0.95); background: var(--bg-card-light); }
    .icon-btn.muted { opacity: 0.4; }
    
    #gameCanvas { 
      display: block; 
      touch-action: none; 
      border-radius: 20px;
      box-shadow: var(--shadow-card), var(--shadow-glow);
    }
    
    .level-badge {
      position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, var(--bg-card), var(--bg-card-light));
      padding: 10px 24px; border-radius: 24px;
      font-weight: 700; font-size: 1rem; z-index: 100;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: var(--shadow-card);
      display: flex; align-items: center; gap: 8px;
    }
    .level-badge::before { content: '🎯'; font-size: 0.9rem; }
    
    .combo-badge {
      position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
      font-size: 3.5rem; font-weight: 900;
      background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(255,215,0,0.8);
      pointer-events: none; opacity: 0;
      z-index: 200;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .combo-badge.show { 
      opacity: 1; 
      animation: comboPop 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes comboPop {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }
    
    .bonus-popup {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 2rem; font-weight: 900;
      pointer-events: none; opacity: 0;
      z-index: 250;
      text-shadow: 0 0 20px currentColor;
    }
    .bonus-popup.show {
      animation: bonusPop 1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes bonusPop {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -80%) scale(1); opacity: 0; }
    }
    
    .info-panel {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 20px; display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 12px;
      z-index: 100; background: linear-gradient(to top, rgba(15,15,26,0.98), transparent);
    }
    .info-card { 
      background: linear-gradient(145deg, var(--bg-card), rgba(26,26,46,0.8)); 
      border-radius: 18px; padding: 14px; text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: var(--shadow-card);
    }
    .info-label { 
      font-size: 0.7rem; color: var(--text-secondary); 
      text-transform: uppercase; letter-spacing: 1.5px; 
      margin-bottom: 6px; font-weight: 600;
    }
    .info-value { 
      font-size: 1.6rem; font-weight: 800; 
      background: linear-gradient(135deg, var(--accent-orange), #FF6B35);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .info-value.target { 
      background: linear-gradient(135deg, var(--accent-cyan), #2DD4BF);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .info-value.combo { 
      background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .progress-container { 
      width: 100%; height: 6px; background: rgba(255,255,255,0.1); 
      border-radius: 3px; overflow: hidden; margin-top: 10px; 
    }
    .progress-fill { 
      height: 100%; 
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      border-radius: 3px; 
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px var(--accent-cyan);
    }
    
    .bottom-buttons {
      position: absolute; bottom: 130px; left: 0; right: 0;
      padding: 0 20px; display: flex; gap: 10px; z-index: 100;
    }
    .game-btn {
      flex: 1; padding: 14px 12px; border-radius: 16px; border: none;
      font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: uppercase; letter-spacing: 1px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .game-btn.primary {
      background: linear-gradient(135deg, var(--accent-orange), #FF6B35);
      color: white; 
      box-shadow: 0 4px 20px rgba(255,140,66,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .game-btn.secondary { 
      background: rgba(255,255,255,0.08); 
      color: var(--text-primary); 
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
    }
    .game-btn:hover { transform: translateY(-3px); }
    .game-btn:active { transform: scale(0.96); }
    
    .loading {
      position: fixed; inset: 0; background: var(--bg-dark);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
      transition: opacity 0.5s ease;
    }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 60px; height: 60px; border: 4px solid var(--bg-card);
      border-top-color: var(--accent-orange); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-text {
      margin-top: 20px; color: var(--text-secondary); font-size: 0.9rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px); z-index: 500;
      display: none; align-items: center; justify-content: center;
      animation: fadeIn 0.3s ease;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
      background: linear-gradient(145deg, var(--bg-card), var(--bg-card-light));
      border-radius: 24px; padding: 28px; width: 90%; max-width: 340px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: var(--shadow-card);
      animation: slideUp 0.3s ease;
    }
    .modal-content h2 {
      font-size: 1.4rem; margin-bottom: 20px; text-align: center;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-yellow));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .setting-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-label { font-size: 1rem; font-weight: 600; }
    .toggle {
      width: 56px; height: 30px; background: rgba(255,255,255,0.15);
      border-radius: 15px; position: relative; cursor: pointer;
      transition: background 0.3s ease;
    }
    .toggle.on { background: var(--accent-green); }
    .toggle::after {
      content: ''; position: absolute; width: 24px; height: 24px;
      background: white; border-radius: 50%; top: 3px; left: 3px;
      transition: transform 0.3s ease;
    }
    .toggle.on::after { transform: translateX(26px); }
    
    .control-mode-row {
      display: flex; gap: 10px; margin-top: 15px;
    }
    .mode-btn {
      flex: 1; padding: 12px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.1);
      background: transparent; color: var(--text-primary); font-size: 0.85rem;
      font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .mode-btn.active {
      border-color: var(--accent-orange);
      background: rgba(255,140,66,0.2);
    }
    
    .close-modal {
      width: 100%; margin-top: 20px; padding: 14px;
      background: linear-gradient(135deg, var(--accent-purple), #8B5CF6);
      color: white; border: none; border-radius: 14px;
      font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 700;
      cursor: pointer;
    }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    .touch-ripple {
      position: fixed; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,140,66,0.4) 0%, transparent 70%);
      pointer-events: none; animation: ripple 0.6s ease-out forwards;
    }
    @keyframes ripple {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    
    .start-overlay {
      position: fixed; inset: 0; background: var(--bg-dark);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 2000; cursor: pointer;
    }
    .start-overlay.hidden { display: none; }
    .start-btn {
      width: 120px; height: 120px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-yellow));
      border: none; font-size: 3rem; cursor: pointer;
      box-shadow: 0 0 40px rgba(255,140,66,0.5);
      animation: pulse 2s infinite;
    }
    .start-text {
      margin-top: 20px; font-size: 1.2rem; color: var(--text-secondary);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="start-overlay" id="startOverlay">
      <button class="start-btn" id="startBtn">🐯</button>
      <p class="start-text">Нажми, чтобы начать!</p>
    </div>
    
    <div class="header">
      <div class="title">🐯 Нейроармада</div>
      <div class="header-controls">
        <button class="icon-btn" id="soundBtn" title="Звук">🔊</button>
        <button class="icon-btn" id="musicBtn" title="Музыка">🎵</button>
        <button class="icon-btn" id="settingsBtn" title="Настройки">⚙️</button>
      </div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div class="level-badge">🎯 Уровень 1</div>
    <div class="combo-badge"></div>
    <div class="bonus-popup"></div>
    
    <div class="bottom-buttons">
      <button class="game-btn secondary" id="hintBtn">💡 Подсказка</button>
      <button class="game-btn primary" id="addBtn">➕ Добавить</button>
      <button class="game-btn secondary" id="resetBtn">🔄 Заново</button>
    </div>
    
    <div class="info-panel">
      <div class="info-card">
        <div class="info-label">Счёт</div>
        <div class="info-value">0</div>
      </div>
      <div class="info-card">
        <div class="info-label">Цель</div>
        <div class="info-value target">200</div>
        <div class="progress-container">
          <div class="progress-fill" style="width: 0%"></div>
        </div>
      </div>
      <div class="info-card">
        <div class="info-label">Бонус</div>
        <div class="info-value combo">x1.0</div>
      </div>
    </div>
    
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Загрузка игры...</div>
    </div>
    
    <div class="modal-overlay" id="settingsModal">
      <div class="modal-content">
        <h2>⚙️ Настройки</h2>
        
        <div class="setting-row">
          <span class="setting-label">🔊 Звук</span>
          <div class="toggle on" id="soundToggle"></div>
        </div>
        
        <div class="setting-row">
          <span class="setting-label">🎵 Музыка</span>
          <div class="toggle on" id="musicToggle"></div>
        </div>
        
        <div class="setting-row">
          <span class="setting-label">👆 Управление</span>
        </div>
        <div class="control-mode-row">
          <button class="mode-btn active" id="tapMode">👆 Тап</button>
          <button class="mode-btn" id="dragMode">✋ Свайп</button>
        </div>
        
        <button class="close-modal" id="closeSettings">Сохранить</button>
      </div>
    </div>
  </div>
  
  <script type="module" src="src/main.js"></script>
</body>
</html>
